name: Build and Push fhl.dc2.crunchtools.com

on:
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - 'etc/**'
      - '.github/workflows/**'
  workflow_call:
  workflow_dispatch:

env:
  IMAGE_NAME: quay.io/crunchtools/fhl.dc2.crunchtools.com
  BUILDAH_FORMAT: oci
  GHCR_IMAGE: ghcr.io/crunchtools/fhl.dc2.crunchtools.com

jobs:
  build-and-push-quay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha_short: ${{ steps.version.outputs.sha_short }}
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version tag
        id: version
        run: |
          TAG=$(git describe --tags --always 2>/dev/null || echo "v0.1.0")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to quay.io
        run: |
          podman login quay.io \
            -u '${{ secrets.QUAY_USERNAME }}' \
            -p '${{ secrets.QUAY_PASSWORD }}'

      - name: Build image with Podman
        run: |
          podman build \
            --tag ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} \
            --tag ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.sha_short }} \
            --tag ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push image to Quay.io
        run: |
          podman push ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          podman push ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.sha_short }}
          podman push ${{ env.IMAGE_NAME }}:latest

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Install skopeo
        run: |
          command -v skopeo >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          }

      # Copy the manifest Quay already holds rather than building again. The
      # tags come from the Quay job's outputs so the two registries cannot drift
      # apart, and --all carries every manifest in the list, not just amd64.
      - name: Copy image from Quay to GHCR
        run: |
          for tag in \
            "${{ needs.build-and-push-quay.outputs.tag }}" \
            "${{ needs.build-and-push-quay.outputs.sha_short }}" \
            latest
          do
            skopeo copy --all \
              --src-creds '${{ secrets.QUAY_USERNAME }}:${{ secrets.QUAY_PASSWORD }}' \
              --dest-creds '${{ github.repository_owner }}:${{ github.token }}' \
              "docker://${{ env.IMAGE_NAME }}:$tag" \
              "docker://${{ env.GHCR_IMAGE }}:$tag"
          done
